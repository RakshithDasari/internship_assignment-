# NVIDIA GPU override (Docker Desktop on Windows/WSL2 supports this out of the box;
# on Linux install the NVIDIA Container Toolkit):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build -d
# The worker runs inference on the GPU; the backend sees it too, so /health and the
# Upload page report the GPU the worker will use. Both share the one card.

x-gpu: &gpu
  build:
    args:
      TORCH_INDEX_URL: https://download.pytorch.org/whl/cu128
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  backend: *gpu
  worker: *gpu
