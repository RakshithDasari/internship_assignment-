# NVIDIA GPU override (needs the NVIDIA Container Toolkit):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# Only the worker runs inference, so only it gets the GPU.

services:
  api:
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu128

  worker:
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu128
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
